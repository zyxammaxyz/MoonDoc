<!doctype html>
<html lang="en">

    <meta property="og:url" content="https://mooncall.org/" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts for crisp medical aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Structured data: tells Google exactly what MoonCall is, independent
         of the JS-rendered page content. Safe to keep even after real
         routing / per-page schema (e.g. JobPosting on shift pages) is
         added later -- this Organization block doesn't conflict with it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MoonCall",
        "url": "https://mooncall.org/",
        "logo": "https://mooncall.org/brand/logo.png",
        "description": "MoonCall connects verified resident physicians with real moonlighting shifts across Southern California urgent cares and hospitals, with a shared credential vault, automated NPI verification, and transparent pay and malpractice coverage on every posting.",
        "areaServed": {
          "@type": "State",
          "name": "California"
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>

  </body>
